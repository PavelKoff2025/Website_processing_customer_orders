  <text x="48" y="580" fill="#7a7166" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13">localhost:8000/docs с хоста не открывается — порт backend не опубликован (п.5).</text>
  <text x="48" y="604" fill="#2b241c" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13">Рабочий адрес преподавателя: https://karikovpavel.ru/docs</text>

