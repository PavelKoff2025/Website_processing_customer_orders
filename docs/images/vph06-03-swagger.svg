  <text x="108" y="32" fill="#7a7166" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11">karikovpavel.ru/docs</text>
  
  <rect x="24" y="56" width="1232" height="48" fill="#1b1b1b"/>
  <text x="48" y="88" fill="#fff" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="18">Autello Backend</text>
  <rect x="1080" y="66" width="150" height="28" rx="6" fill="#49cc90"/>
  <text x="1155" y="85" text-anchor="middle" fill="#083" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="12">Authorize</text>
  <text x="48" y="140" fill="#7a7166" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13">OpenAPI 3 · JWT bearer · статика без CDN, отдаёт Nginx /static/</text>
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14">
    <rect x="48" y="168" width="1184" height="44" rx="8" fill="#eaf6ea"/>
    <text x="68" y="196" fill="#3b7"><tspan font-weight="700">POST</tspan>   /api/auth/login</text>
    <rect x="48" y="220" width="1184" height="44" rx="8" fill="#eaf2fb"/>
    <text x="68" y="248" fill="#3a6ea5"><tspan font-weight="700">GET</tspan>    /api/applications/</text>
    <rect x="48" y="272" width="1184" height="44" rx="8" fill="#eaf2fb"/>
    <text x="68" y="300" fill="#3a6ea5"><tspan font-weight="700">GET</tspan>    /api/admin</text>
    <rect x="48" y="324" width="1184" height="44" rx="8" fill="#eaf6ea"/>
    <text x="68" y="352" fill="#3b7"><tspan font-weight="700">POST</tspan>   /api/admin</text>
    <rect x="48" y="376" width="1184" height="44" rx="8" fill="#fbf2ea"/>
    <text x="68" y="404" fill="#b36b1a"><tspan font-weight="700">PUT</tspan>    /api/admin/{id}</text>
    <rect x="48" y="428" width="1184" height="44" rx="8" fill="#fbeaea"/>
    <text x="68" y="456" fill="#a33"><tspan font-weight="700">DELETE</tspan> /api/admin/{id}</text>
    <rect x="48" y="480" width="1184" height="44" rx="8" fill="#eaf2fb"/>
    <text x="68" y="508" fill="#3a6ea5"><tspan font-weight="700">GET</tspan>    /api/behavior-metrics/</text>
