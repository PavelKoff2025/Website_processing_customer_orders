# =============================================================================
#  Публичный сайт: лендинг для "тёплых" клиентов + единственный путь к API
# =============================================================================

# --- HTTP: только ACME-челлендж и редирект на HTTPS --------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: сайт + /api/ -----------------------------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_zone 32;

    root  /usr/share/nginx/html;
    index index.html;

    # Пробник для healthcheck самого Nginx.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- статика фронтенда (SPA-friendly) -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- API: ЕДИНСТВЕННЫЙ маршрут к backend --------------------------------
    # Backend не публикует порты и живёт во внутренней сети, поэтому снаружи
    # он достижим исключительно через этот location.
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        # Имя апстрима в переменной => резолвится в рантайме через Docker DNS.
        # Nginx стартует нормально, даже пока сервиса backend не существует.
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;

        include /etc/nginx/snippets/proxy.conf;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;

        # Пока бэкенда нет — отдаём внятную 503 вместо 502.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Приём заявки: отдельный, более строгий лимит против спама формы.
    location = /api/leads {
        limit_req zone=form_zone burst=5 nodelay;

        set $backend_host backend;
        proxy_pass http://$backend_host:8000;

        include /etc/nginx/snippets/proxy.conf;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"backend_unavailable","detail":"Backend service is not deployed yet."}';
    }

    # --- pgAdmin за Basic-Auth ----------------------------------------------
    # Сам контейнер pgAdmin портов не публикует — только через этот location.
    #
    # ^~ обязателен: иначе regex-location для *.css/*.js выше перехватывает
    # статику панели, ищет файлы в корне фронтенда и отдаёт 404.
    # Завершающий слэш в префиксе сохраняем: без него SCRIPT_NAME ломает
    # пути к /static/, и панель открывается «пустой».
    location = /pgadmin {
        return 301 /pgadmin/;
    }

    location ^~ /pgadmin/ {
        # Рекомендуется сузить до офисных IP: раскомментировать и подставить.
        # allow 203.0.113.10;
        # deny  all;

        limit_req zone=admin_zone burst=20 nodelay;

        auth_basic           "Autello — restricted area";
        auth_basic_user_file /etc/nginx/auth/pgadmin.htpasswd;

        # ВАЖНО: `set` должен идти ДО `rewrite ... break` — break прекращает
        # обработку директив rewrite-модуля, и переменная осталась бы пустой.
        set $pgadmin_host pgadmin;

        # Срезаем префикс; о самом префиксе Flask узнаёт из X-Script-Name.
        rewrite ^/pgadmin/?(.*)$ /$1 break;

        proxy_pass http://$pgadmin_host:80;

        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header X-Script-Name /pgadmin;

        # Панель может долго выполнять запросы — таймаут больше, чем у API.
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;

        client_max_body_size 32m;
    }

    # Скрытые файлы и мусор сборки наружу не отдаём.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
