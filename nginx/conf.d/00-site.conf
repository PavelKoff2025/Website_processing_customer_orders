# =============================================================================
#  Публичный сайт: лендинг для "тёплых" клиентов + единственный путь к API
# =============================================================================

# --- HTTP: только ACME-челлендж и редирект на HTTPS --------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: сайт + /api/ -----------------------------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn conn_zone 32;

    root  /usr/share/nginx/html;
    index index.html;

    # Пробник для healthcheck самого Nginx.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- статика фронтенда (SPA-friendly) -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /admin.html {
        add_header Cache-Control "no-store";
    }

    location = /admin {
        return 301 /admin.html;
    }

    # --- API: ЕДИНСТВЕННЫЙ маршрут к backend --------------------------------
    # Backend не публикует порты и живёт во внутренней сети, поэтому снаружи
    # он достижим исключительно через этот location.
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        # Имя апстрима в переменной => резолвится в рантайме через Docker DNS.
        # Nginx стартует нормально, даже пока сервиса backend не существует.
        set $backend_host backend;
        # Без хвоста /api/ — иначе получится /api/api/auth/check.
        proxy_pass http://$backend_host:8000;

        include /etc/nginx/snippets/proxy.conf;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;

        # Пока бэкенда нет — отдаём внятную 503 вместо 502.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Явный путь авторизации (check / login / me / verify) — тот же backend,
    # URI не переписывается.
    location /api/auth/ {
        limit_req zone=api_zone burst=20 nodelay;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Приём заявки: отдельный, более строгий лимит против спама формы.
    location = /api/leads {
        limit_req zone=form_zone burst=5 nodelay;

        set $backend_host backend;
        proxy_pass http://$backend_host:8000;

        include /etc/nginx/snippets/proxy.conf;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"backend_unavailable","detail":"Backend service is not deployed yet."}';
    }

    # --- Swagger /docs на время тестирования --------------------------------
    # Backend порт на хост не публикует, поэтому UI доступен только через Nginx.
    # После тестов эти location можно убрать.
    location ^~ /docs {
        limit_req zone=api_zone burst=20 nodelay;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location ^~ /redoc {
        limit_req zone=api_zone burst=20 nodelay;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Локальные swagger/redoc JS+CSS. ^~ нужен, иначе regex *.js/*.css
    # заберёт файлы в статику фронта и отдаст 404 — страница останется белой.
    location ^~ /static/ {
        limit_req zone=api_zone burst=20 nodelay;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location = /openapi.json {
        limit_req zone=api_zone burst=20 nodelay;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # pgAdmin на закрытом деплое выключен: не проксируем, отвечаем 403.
    location = /pgadmin {
        return 403;
    }

    location ^~ /pgadmin/ {
        default_type text/plain;
        return 403 "pgadmin_disabled\n";
    }

    # Скрытые файлы и мусор сборки наружу не отдаём.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
