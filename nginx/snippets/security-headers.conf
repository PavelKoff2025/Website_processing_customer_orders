# HSTS на karikovpavel.ru заставляет Chrome ходить на :5000 только по HTTPS.
# Реестр у нас plain HTTP (схема преподавателя) — HSTS даёт ERR_SSL_PROTOCOL_ERROR.
# Пока реестр без TLS, заголовок не шлём. Редирект http→https на :80/:443 остаётся.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
