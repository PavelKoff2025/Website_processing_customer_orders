user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- логи: без полного User-Agent-мусора, но с временем ответа апстрима --
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'urt=$upstream_response_time "$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Форма лида — это небольшой JSON, гигантские тела нам не нужны.
    client_max_body_size      1m;
    client_body_buffer_size   16k;
    client_header_timeout     15s;
    client_body_timeout       15s;
    send_timeout              30s;
    large_client_header_buffers 4 16k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff2;

    # --- лимиты: защита формы от спама и API от перебора --------------------
    limit_req_zone  $binary_remote_addr  zone=api_zone:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=form_zone:10m  rate=20r/m;
    # pgAdmin дергает /sqleditor/status/ раз в ~2 с на каждую вкладку Query Tool.
    # 30r/m ломал панель (429). Basic Auth на location уже ограничивает доступ.
    limit_req_zone  $binary_remote_addr  zone=admin_zone:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_zone:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Встроенный DNS Docker: позволяет держать proxy_pass в переменной,
    # чтобы Nginx стартовал даже когда контейнера backend ещё не существует.
    resolver        127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
